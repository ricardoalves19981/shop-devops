name: Shop CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Shop.Api/Shop.Api.csproj

      - name: Build
        run: dotnet build Shop.Api/Shop.Api.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Shop.Api/Shop.Api.csproj --no-build

      - name: Build Docker Image
        run: |
          docker build -t shop-api:latest ./Shop.Api