name: Shop CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - develop
      - main
      

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Shop.Api/Shop.Api.csproj

      - name: Build
        run: dotnet build Shop.Api/Shop.Api.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Shop.Api/Shop.Api.csproj --no-build

      - name: Build Docker Image
        run: |
          docker build -t shop-api:latest ./Shop.Api

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Image
        run: |
         docker tag shop-api:latest \
         ${{ secrets.DOCKER_USERNAME }}/shop-api:latest

      - name: Push Image
        run: |
         docker push \
         ${{ secrets.DOCKER_USERNAME }}/shop-api:latest