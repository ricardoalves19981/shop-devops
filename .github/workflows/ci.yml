name: Shop CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Shop.Api/Shop.Api.csproj

      - name: Build
        run: dotnet build Shop.Api/Shop.Api.csproj --configuration Release --no-restore

      # زمانی که پروژه تست ساختیم این قسمت را فعال می‌کنیم
      # - name: Run Tests
      #   run: dotnet test Shop.Api.Tests/Shop.Api.Tests.csproj --no-build

      - name: Set Image Tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/shop-api:${IMAGE_TAG} \
          -t ${{ secrets.DOCKER_USERNAME }}/shop-api:latest \
          ./Shop.Api

      - name: Push Version Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/shop-api:${IMAGE_TAG}

      - name: Push Latest Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/shop-api:latest